name: Smith Research Scan
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile core/atlas_trading.py core/atlas_core.py && echo "Smith scan smoke test OK"
